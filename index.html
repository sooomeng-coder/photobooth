<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Photo Booth</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; background: #0d0d0d; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Apple SD Gothic Neo", sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: manipulation; }

  .screen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; }
  .screen.active { display: flex; }

  /* 프레임 비율을 유지하면서 화면에 최대한 꽉 차는 무대 */
  .stage { --ar: 1.45; position: relative; width: min(100vw, calc(100vh * var(--ar)));
    height: min(100vh, calc(100vw / var(--ar))); }
  .stage > img, .stage > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* 시작 화면 */
  #startScreen { cursor: pointer; }
  #startBtn { position: absolute; left: 24%; top: 64%; width: 52%; height: 22%;
    border: 0; background: transparent; cursor: pointer; border-radius: 40px;
    animation: pulse 1.6s ease-in-out infinite; }
  #startBtn:active { transform: scale(.96); }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(0,255,60,0); }
    50% { box-shadow: 0 0 40px 8px rgba(0,255,60,.35); }
  }

  /* 촬영 화면 */
  .shutter { position: absolute; left: 50%; bottom: 4%; transform: translateX(-50%);
    width: clamp(64px, 9vmin, 110px); height: clamp(64px, 9vmin, 110px); border-radius: 50%;
    background: #fff; border: 6px solid rgba(0,0,0,.25); box-shadow: 0 0 0 5px #fff, 0 6px 24px rgba(0,0,0,.4);
    cursor: pointer; transition: transform .1s; }
  .shutter:active { transform: translateX(-50%) scale(.92); }
  .shutter:disabled { opacity: 0; pointer-events: none; }
  #countdown { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: min(40vmin, 360px); font-weight: 900; color: #fff; pointer-events: none;
    text-shadow: 0 0 30px rgba(0,0,0,.6), 0 6px 0 rgba(0,0,0,.35); }
  #countdown.tick { animation: tick 1s ease-out; }
  @keyframes tick { 0% { transform: scale(1.5); opacity: 0; } 20% { transform: scale(1); opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; } }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 50; }
  #flash.go { animation: flash .5s ease-out; }
  @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }

  /* 결과 화면 */
  .btnRow { position: absolute; left: 0; right: 0; bottom: 4%; display: flex; gap: 3vmin; justify-content: center; }
  .btn { font-size: clamp(18px, 3.4vmin, 34px); font-weight: 800; letter-spacing: .08em;
    padding: .7em 1.8em; border-radius: 999px; border: 4px solid #00e83a; cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,.35); transition: transform .1s; }
  .btn:active { transform: scale(.95); }
  .btn.save { background: #00e83a; color: #fff; }
  .btn.retake { background: #fff; color: #00b82e; }
  .btn:disabled { opacity: .35; pointer-events: none; }
  .home { position: absolute; top: 2.5%; left: 2%; width: clamp(40px, 6vmin, 60px); height: clamp(40px, 6vmin, 60px);
    border-radius: 50%; border: 0; background: rgba(0,0,0,.45); color: #fff; font-size: clamp(18px, 3vmin, 28px);
    cursor: pointer; display: flex; align-items: center; justify-content: center; }

  /* 프레임 선택 화면 */
  #frameScreen { flex-direction: column; gap: 4vmin; padding: 5vmin; background: radial-gradient(circle at 50% 0%, #1f2a1f, #0d0d0d 70%); }
  #frameScreen h1 { color: #fff; font-size: clamp(26px, 5vmin, 56px); font-weight: 900; letter-spacing: .12em; }
  #frameScreen h1 span { color: #00e83a; }
  #frameScreen p { color: rgba(255,255,255,.6); font-size: clamp(14px, 2.2vmin, 22px); margin-top: -2vmin; }
  #frameList { display: flex; flex-wrap: wrap; gap: 3vmin; justify-content: center; align-content: center;
    max-width: 100%; max-height: 70vh; overflow-y: auto; padding: 1vmin; }
  .frameCard { position: relative; width: clamp(200px, 30vmin, 380px); border: 4px solid transparent; border-radius: 18px;
    background: #222; padding: 0; overflow: hidden; cursor: pointer; transition: transform .12s, border-color .12s;
    box-shadow: 0 8px 28px rgba(0,0,0,.5); }
  .frameCard:hover { border-color: #00e83a; }
  .frameCard:active { transform: scale(.96); }
  .frameCard img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: #111; }
  .frameCard .liveBadge { position: absolute; top: 10px; right: 10px; background: #fff; color: #00a82a; font-weight: 900;
    font-size: clamp(11px, 1.6vmin, 16px); letter-spacing: .08em; padding: .25em .7em; border-radius: 999px;
    box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .frameCard .label { display: block; padding: .6em .8em; color: #fff; font-weight: 800; letter-spacing: .06em;
    font-size: clamp(14px, 2.2vmin, 22px); text-align: center; background: #181818; }
  .frameCard .num { position: absolute; top: 10px; left: 10px; background: #00e83a; color: #fff; font-weight: 900;
    width: 2em; height: 2em; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: clamp(13px, 2vmin, 20px); box-shadow: 0 2px 8px rgba(0,0,0,.4); }

  .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    color: #fff; background: rgba(0,0,0,.65); font-size: clamp(16px, 2.6vmin, 26px); line-height: 1.6; padding: 24px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- 1. 시작 화면 -->
<section id="startScreen" class="screen active">
  <div class="stage">
    <img id="startImg" alt="start">
    <button id="startBtn" aria-label="START"></button>
  </div>
</section>

<!-- 2. 프레임 선택 화면 -->
<section id="frameScreen" class="screen">
  <h1>CHOOSE <span>FRAME</span></h1>
  <p>마음에 드는 프레임을 눌러주세요</p>
  <div id="frameList"></div>
  <button class="home" data-home aria-label="처음으로">⌂</button>
</section>

<!-- 3. 촬영 화면 -->
<section id="shootScreen" class="screen">
  <div class="stage">
    <canvas id="live"></canvas>
    <div id="countdown"></div>
    <button id="shutterBtn" class="shutter" aria-label="촬영"></button>
    <button class="home" data-back aria-label="프레임 다시 고르기">←</button>
    <div id="camMsg" class="msg hidden"></div>
  </div>
</section>

<!-- 4. 결과 화면 -->
<section id="resultScreen" class="screen">
  <div class="stage">
    <img id="resultImg" alt="result">
    <div class="btnRow">
      <button id="saveBtn" class="btn save">SAVE</button>
      <button id="retakeBtn" class="btn retake">RETAKE</button>
    </div>
    <button class="home" data-home aria-label="처음으로">⌂</button>
  </div>
</section>

<div id="flash"></div>
<video id="video" playsinline webkit-playsinline muted autoplay style="position:fixed;left:0;top:0;width:2px;height:2px;opacity:0.01;pointer-events:none;z-index:-1"></video>

<script>
/* ================= 설정 ================= */
const CONFIG = {
  COUNTDOWN: 5,          // 카운트다운 초
  MAX_RETAKE: 1,         // 다시 찍기 허용 횟수
  FILE_PREFIX: 'photobooth',
};
const IMG_START = 'assets/start.jpg';

/* 프레임 목록은 frames/frames.json 에서 불러옴.
   프레임 추가: frames/ 폴더에 PNG를 넣고 frames.json 에 한 줄 추가
   { "name": "이름", "src": "frames/파일.png", "thumb": "frames/thumbs/파일.jpg" }  (thumb는 생략 가능) */
const FRAMES_JSON = 'frames/frames.json';
const FALLBACK_FRAMES = [{ name: 'FRAME 1', src: 'frames/frame1.png', thumb: 'frames/thumbs/frame1.jpg' }];
let FRAMES = [];

async function loadFrames() {
  try {
    const r = await fetch(FRAMES_JSON, { cache: 'no-cache' });
    if (!r.ok) throw new Error(r.status);
    const list = await r.json();
    if (!Array.isArray(list) || !list.length) throw new Error('empty');
    return list.filter(f => f && (f.src || f.live));
  } catch (e) {
    console.warn('frames.json을 읽지 못해 기본 프레임을 사용합니다.', e);
    return FALLBACK_FRAMES;
  }
}

/* ================= 요소 ================= */
const $ = id => document.getElementById(id);
const screens = { start: $('startScreen'), frame: $('frameScreen'), shoot: $('shootScreen'), result: $('resultScreen') };
const video = $('video');
const live = $('live');
const lctx = live.getContext('2d');

// cur: 지금 선택된 프레임 { W, H, overlay, bg, stickers, live }
let cur = null, stream = null, rafId = 0, busy = false;
let retakesLeft = CONFIG.MAX_RETAKE, resultBlob = null;

/* ================= 이미지 로드 & 그린스크린 처리 ================= */
function loadImg(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
}

// 초록 픽셀을 투명하게 만든 오버레이
function buildOverlay(img) {
  const W = img.naturalWidth, H = img.naturalHeight;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0);
  const d = ctx.getImageData(0, 0, W, H), p = d.data;
  const LO = 40, HI = 110; // 초록 우세 정도 임계값 (부드러운 경계)
  for (let i = 0; i < p.length; i += 4) {
    const r = p[i], g = p[i + 1], b = p[i + 2];
    const diff = g - Math.max(r, b);
    if (diff >= HI) { p[i + 3] = 0; }
    else if (diff > LO) {
      const a = 1 - (diff - LO) / (HI - LO);
      p[i + 3] = Math.round(p[i + 3] * a); // 원래 투명도(PNG 알파)에 곱함
      p[i + 1] = Math.max(r, b);     // 초록 번짐 제거
    }
  }
  ctx.putImageData(d, 0, 0);

  return c;
}

/* ================= 합성 ================= */
// 영상을 (dx,dy,dw,dh) 영역에 cover 방식 + 좌우반전으로 그리기
function drawMirroredCover(ctx, src, sw, sh, dx, dy, dw, dh) {
  const scale = Math.max(dw / sw, dh / sh);
  const cw = dw / scale, ch = dh / scale;
  const sx = (sw - cw) / 2, sy = (sh - ch) / 2;
  ctx.save();
  ctx.beginPath(); ctx.rect(dx, dy, dw, dh); ctx.clip();
  ctx.translate(dx + dw, dy); ctx.scale(-1, 1);
  ctx.drawImage(src, sx, sy, cw, ch, 0, 0, dw, dh);
  ctx.restore();
}

// 사람만 오려낸 카메라 영상을 그릴 임시 캔버스
const personCanvas = document.createElement('canvas'), pctx = personCanvas.getContext('2d');

function compose(ctx, W, H) {
  const sw = video.videoWidth, sh = video.videoHeight;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (cur.bg) {
    // 배경 → 사람만 오려서 위에 (마스크가 아직 없으면 배경만)
    ctx.drawImage(cur.bg, 0, 0, W, H);
    if (sw && sh && maskReady) {
      if (personCanvas.width !== W || personCanvas.height !== H) { personCanvas.width = W; personCanvas.height = H; }
      pctx.globalCompositeOperation = 'source-over';
      pctx.clearRect(0, 0, W, H);
      drawMirroredCover(pctx, video, sw, sh, 0, 0, W, H);
      pctx.globalCompositeOperation = 'destination-in';
      drawMirroredCover(pctx, maskCanvas, maskCanvas.width, maskCanvas.height, 0, 0, W, H);
      ctx.drawImage(personCanvas, 0, 0);
    }
  } else if (sw && sh) {
    // 카메라 한 화면을 프레임 전체 뒤에 깔고, 초록 구멍으로 보이게 함
    drawMirroredCover(ctx, video, sw, sh, 0, 0, W, H);
  }
  if (cur.overlay) ctx.drawImage(cur.overlay, 0, 0, W, H);
  if (cur.stickers && sw && sh) drawStickers(ctx, W, H, sw, sh);
}

function fitLiveCanvas() {
  const r = live.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
  if (live.width !== w || live.height !== h) { live.width = w; live.height = h; }
}

function loop(now) {
  fitLiveCanvas();
  if (cur.live) infer(now || performance.now());
  compose(lctx, live.width, live.height);
  rafId = requestAnimationFrame(loop);
}

/* ================= 반응형 프레임: 얼굴 인식 + 사람 오려내기 ================= */
const VISION = {
  BASE: 'vendor/mediapipe/',
  FACE_MODEL: 'models/blaze_face_full_range.tflite', // 1.5~3m 떨어진 여러 명용
  SEG_MODEL: 'models/selfie_segmenter.tflite',
  INFER_MS: 45,      // 인식 간격(ms). 화면은 매 프레임 그리고, 인식은 이 간격으로
  INPUT_W: 640,      // 인식용으로 줄인 영상 폭
  MAX_FACES: 6,
  HOLD_MS: 400,      // 얼굴을 잠깐 놓쳐도 스티커를 유지하는 시간
  SMOOTH: 0.55,      // 스티커 떨림 줄이기 (0~1, 클수록 새 위치를 빨리 따라감)
};

// 스티커 위치 규칙. 기준 길이 d = 두 눈 사이 거리 (화면 기준).
// at: 붙는 점, w: PNG 가로가 d의 몇 배인지, ax/ay: PNG에서 그 점에 맞출 위치(0~1)
// 좌표는 얼굴 기준: u = 눈을 잇는 방향(오른쪽 +), v = 아래쪽 +
const ANCHORS = {
  'eye-left':    { at: f => f.eyeL, w: 1, ax: .5, ay: 0 },
  'eye-right':   { at: f => f.eyeR, w: 1, ax: .5, ay: 0 },
  'cheek-left':  { at: f => off(f, f.eyeL, -.15, .75), w: 1, ax: .5, ay: .5 },
  'cheek-right': { at: f => off(f, f.eyeR, .15, .75), w: 1, ax: .5, ay: .5 },
  'nose':        { at: f => f.nose, w: 1, ax: .5, ay: .5 },
  'mouth':       { at: f => f.mouth, w: 1, ax: .5, ay: .5 },
  'face':        { at: f => f.nose, w: 2.2, ax: .5, ay: .5 },
  'head':        { at: f => off(f, mid(f.eyeL, f.eyeR), 0, -.9), w: 2.2, ax: .5, ay: 1 },
};
const PAIRS = { eye: ['eye-left', 'eye-right'], cheek: ['cheek-left', 'cheek-right'] };
const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
function off(f, p, du, dv) {  // 얼굴 기준 방향으로 d 단위만큼 이동
  const c = Math.cos(f.angle), s = Math.sin(f.angle);
  return { x: p.x + (du * c - dv * s) * f.d, y: p.y + (du * s + dv * c) * f.d };
}

let visionPromise = null, vision = null;
function loadVision() {
  if (!visionPromise) visionPromise = (async () => {
    const mp = await import('./' + VISION.BASE + 'vision_bundle.mjs');
    const files = await mp.FilesetResolver.forVisionTasks(VISION.BASE + 'wasm');
    const create = async (Task, model, opts) => {
      for (const delegate of ['GPU', 'CPU']) {
        try {
          return await Task.createFromOptions(files, { baseOptions: { modelAssetPath: VISION.BASE + model, delegate }, runningMode: 'VIDEO', ...opts });
        } catch (e) { if (delegate === 'CPU') throw e; console.warn('GPU 사용 불가, CPU로 전환', e); }
      }
    };
    const [face, seg] = await Promise.all([
      create(mp.FaceDetector, VISION.FACE_MODEL, { minDetectionConfidence: 0.5 }),
      create(mp.ImageSegmenter, VISION.SEG_MODEL, { outputConfidenceMasks: true, outputCategoryMask: false }),
    ]);
    vision = { face, seg };
    return vision;
  })().catch(e => { visionPromise = null; throw e; });
  return visionPromise;
}

const inferCanvas = document.createElement('canvas');
const ictx = inferCanvas.getContext('2d', { willReadFrequently: true });
const maskCanvas = document.createElement('canvas'), mctx = maskCanvas.getContext('2d');
let maskData = null, maskReady = false, lastInfer = 0, lastTs = 0;
let tracks = [];  // 영상 좌표(0~1, 좌우반전 전)로 저장한 얼굴들

function resetVisionState() { maskReady = false; tracks = []; }

function infer(now) {
  if (!vision || !video.videoWidth || now - lastInfer < VISION.INFER_MS) return;
  lastInfer = now;
  const ts = lastTs = Math.max(now, lastTs + 1);  // 타임스탬프는 계속 증가해야 함
  const w = VISION.INPUT_W, h = Math.round(w * video.videoHeight / video.videoWidth);
  if (inferCanvas.width !== w || inferCanvas.height !== h) { inferCanvas.width = w; inferCanvas.height = h; }
  ictx.drawImage(video, 0, 0, w, h);
  try {
    if (cur.stickers) updateTracks(vision.face.detectForVideo(inferCanvas, ts).detections, now);
    if (cur.bg) vision.seg.segmentForVideo(inferCanvas, ts, r => updateMask(r.confidenceMasks && r.confidenceMasks[0]));
  } catch (e) { console.warn('인식 오류', e); }
}

function updateMask(mask) {
  if (!mask) return;
  const w = mask.width, h = mask.height, conf = mask.getAsFloat32Array();
  if (maskCanvas.width !== w || maskCanvas.height !== h) { maskCanvas.width = w; maskCanvas.height = h; maskData = null; }
  if (!maskData) { maskData = mctx.createImageData(w, h); maskData.data.fill(255); }
  const d = maskData.data;
  for (let i = 0, j = 3; i < conf.length; i++, j += 4) {
    const a = (conf[i] - 0.35) * 3.3;  // 0.35~0.65 사이를 부드러운 경계로
    d[j] = a <= 0 ? 0 : a >= 1 ? 255 : a * 255;
  }
  mctx.putImageData(maskData, 0, 0);
  maskReady = true;
}

function updateTracks(dets, now) {
  const faces = dets.slice(0, VISION.MAX_FACES).map(det => {
    const k = det.keypoints;  // 0,1: 눈  2: 코끝  3: 입
    return k && k.length >= 4 ? { e1: k[0], e2: k[1], nose: k[2], mouth: k[3] } : null;
  }).filter(Boolean);
  const used = new Set();
  for (const f of faces) {
    const c = mid(f.e1, f.e2);
    let best = null, bd = Infinity;
    for (const t of tracks) {
      if (used.has(t)) continue;
      const dd = Math.hypot(t.c.x - c.x, t.c.y - c.y);
      if (dd < bd) { bd = dd; best = t; }
    }
    const pts = ['e1', 'e2', 'nose', 'mouth'];
    if (best && bd < 0.15) {
      const a = VISION.SMOOTH;
      for (const p of pts) { best[p] = { x: best[p].x + (f[p].x - best[p].x) * a, y: best[p].y + (f[p].y - best[p].y) * a }; }
      best.c = mid(best.e1, best.e2); best.seen = now; used.add(best);
    } else {
      const t = { ...f, c, seen: now }; tracks.push(t); used.add(t);
    }
  }
  tracks = tracks.filter(t => now - t.seen < VISION.HOLD_MS);
}

function drawStickers(ctx, W, H, sw, sh) {
  // 영상 좌표 → 화면 좌표 (drawMirroredCover와 같은 변환)
  const scale = Math.max(W / sw, H / sh);
  const cw = W / scale, ch = H / scale, sx = (sw - cw) / 2, sy = (sh - ch) / 2;
  const toScreen = p => ({ x: W - (p.x * sw - sx) * scale, y: (p.y * sh - sy) * scale });
  for (const t of tracks) {
    let a = toScreen(t.e1), b = toScreen(t.e2);
    if (a.x > b.x) [a, b] = [b, a];  // 화면 왼쪽 눈이 eyeL
    const f = { eyeL: a, eyeR: b, nose: toScreen(t.nose), mouth: toScreen(t.mouth),
      d: Math.hypot(b.x - a.x, b.y - a.y), angle: Math.atan2(b.y - a.y, b.x - a.x) };
    if (f.d < 4) continue;
    for (const [name, img] of cur.stickerList) {
      const A = ANCHORS[name], p = A.at(f);
      const w = A.w * f.d, h = w * img.naturalHeight / img.naturalWidth;
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(f.angle);
      ctx.drawImage(img, -A.ax * w, -A.ay * h, w, h);
      ctx.restore();
    }
  }
}

/* ================= 카메라 ================= */
async function startCamera() {
  if (stream) return;
  const msg = $('camMsg');
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    video.srcObject = stream;
    await video.play();
    msg.classList.add('hidden');
  } catch (e) {
    msg.innerHTML = '카메라를 열 수 없어요.<br>브라우저에서 카메라 권한을 허용해 주세요.<br><small>(https 주소 또는 localhost에서 열어야 카메라가 동작해요)</small>';
    msg.classList.remove('hidden');
  }
}

/* ================= 화면 전환 ================= */
function show(name) {
  for (const k in screens) screens[k].classList.toggle('active', k === name);
  cancelAnimationFrame(rafId);
  if (name === 'shoot') { $('shutterBtn').disabled = false; $('countdown').textContent = ''; loop(); }
}

function goFrames() { show('frame'); startCamera(); } // 카메라 권한을 미리 받아둠

const overlayCache = new Map();
let selecting = false;
async function selectFrame(i) {
  const f = FRAMES[i];
  if (!overlayCache.has(i)) {
    if (selecting) return; // 프레임 파일 로딩 중 중복 터치 방지
    selecting = true;
    document.body.style.cursor = 'progress';
    try {
      overlayCache.set(i, f.live ? await prepareLive(f) : await prepareStatic(f));
    } catch (e) {
      console.error('프레임을 불러오지 못했습니다:', f.src, e);
      return;
    } finally {
      selecting = false;
      document.body.style.cursor = '';
    }
  }
  cur = overlayCache.get(i);
  resetVisionState();
  const ar = cur.W / cur.H;
  for (const id of ['shootScreen', 'resultScreen']) screens[id.replace('Screen', '')].querySelector('.stage').style.setProperty('--ar', ar);
  show('shoot');
  await startCamera();
  if (cur.live) {
    const msg = $('camMsg');
    if (!vision) { msg.innerHTML = '얼굴 인식을 준비하고 있어요…'; msg.classList.remove('hidden'); }
    try { await loadVision(); if (stream) msg.classList.add('hidden'); }
    catch (e) {
      console.error(e);
      msg.innerHTML = '얼굴 인식을 불러오지 못했어요.<br>새로고침 후 다시 시도해 주세요.'; msg.classList.remove('hidden');
    }
  }
}

async function prepareStatic(f) {
  const img = await loadImg(f.src);
  return { W: img.naturalWidth, H: img.naturalHeight, overlay: buildOverlay(img) };
}

async function prepareLive(f) {
  loadVision().catch(() => {});  // 이미지 받는 동안 같이 준비
  const [bg, fr, ...st] = await Promise.all([
    f.background ? loadImg(f.background) : null,
    f.src ? loadImg(f.src) : null,
    ...Object.values(f.stickers || {}).map(loadImg),
  ]);
  const names = Object.keys(f.stickers || {});
  const byName = Object.fromEntries(names.map((n, i) => [n, st[i]]));
  // eye.png 하나만 있으면 양쪽 눈에 같이 사용 (cheek도 동일)
  for (const [one, [l, r]] of Object.entries(PAIRS)) {
    if (byName[one]) { byName[l] = byName[l] || byName[one]; byName[r] = byName[r] || byName[one]; delete byName[one]; }
  }
  const stickerList = Object.entries(byName).filter(([n]) => ANCHORS[n]);
  const W = fr ? fr.naturalWidth : f.width || (bg && bg.naturalWidth) || 1640;
  const H = fr ? fr.naturalHeight : f.height || (bg && bg.naturalHeight) || 2360;
  return { W, H, live: true, bg, overlay: fr ? buildOverlay(fr) : null,
    stickers: stickerList.length > 0, stickerList };
}

function buildFrameList() {
  const list = $('frameList');
  FRAMES.forEach((f, i) => {
    const b = document.createElement('button');
    b.className = 'frameCard';
    b.innerHTML = `<span class="num">${i + 1}</span><img alt=""><span class="label"></span>`;
    const im = b.querySelector('img');
    im.decoding = 'async';
    im.src = f.thumb || f.src || f.background;
    if (f.live) b.insertAdjacentHTML('beforeend', '<span class="liveBadge">LIVE</span>');
    if (f.thumb) im.onerror = () => { im.onerror = null; im.src = f.src; };
    b.querySelector('.label').textContent = f.name || `FRAME ${i + 1}`;
    b.addEventListener('click', () => selectFrame(i));
    list.appendChild(b);
  });
}

function goHome() {
  busy = false; retakesLeft = CONFIG.MAX_RETAKE; resultBlob = null;
  show('start');
}
function goBackToFrames() { busy = false; show('frame'); }

/* ================= 촬영 ================= */
const wait = ms => new Promise(r => setTimeout(r, ms));

async function shoot() {
  if (busy || !video.videoWidth) return;
  busy = true;
  $('shutterBtn').disabled = true;
  const cd = $('countdown');
  for (let n = CONFIG.COUNTDOWN; n >= 1; n--) {
    if (!screens.shoot.classList.contains('active')) { busy = false; return; }
    cd.textContent = n; cd.classList.remove('tick'); void cd.offsetWidth; cd.classList.add('tick');
    await wait(1000);
  }
  cd.textContent = '';
  if (!screens.shoot.classList.contains('active')) { busy = false; return; }

  // 원본 프레임 해상도로 합성
  const out = document.createElement('canvas');
  out.width = cur.W; out.height = cur.H;
  compose(out.getContext('2d'), out.width, out.height);

  const f = $('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');

  resultBlob = await new Promise(r => out.toBlob(r, 'image/png'));
  const img = $('resultImg');
  if (img.src.startsWith('blob:')) URL.revokeObjectURL(img.src);
  img.src = URL.createObjectURL(resultBlob);
  $('retakeBtn').disabled = retakesLeft <= 0;
  busy = false;
  show('result');
}

function save() {
  if (!resultBlob) return;
  const d = new Date(), z = n => String(n).padStart(2, '0');
  const name = `${CONFIG.FILE_PREFIX}_${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}.png`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(resultBlob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function retake() {
  if (retakesLeft <= 0) return;
  retakesLeft--;
  show('shoot');
}

/* ================= 초기화 ================= */
(async function init() {
  const startImg = await loadImg(IMG_START);
  screens.start.querySelector('.stage').style.setProperty('--ar', startImg.naturalWidth / startImg.naturalHeight);
  $('startImg').src = startImg.src;
  FRAMES = await loadFrames();
  buildFrameList();
  $('resultImg').src = '';

  screens.start.addEventListener('click', goFrames);
  $('shutterBtn').addEventListener('click', shoot);
  $('saveBtn').addEventListener('click', save);
  $('retakeBtn').addEventListener('click', retake);
  document.querySelectorAll('[data-home]').forEach(b => b.addEventListener('click', goHome));
  document.querySelectorAll('[data-back]').forEach(b => b.addEventListener('click', goBackToFrames));
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'Enter') {
      if (screens.start.classList.contains('active')) goFrames();
      else if (screens.frame.classList.contains('active') && FRAMES.length === 1) selectFrame(0);
      else if (screens.shoot.classList.contains('active')) shoot();
    }
  });
})();
</script>
